name: nextjs-ddd-sample

services:
  app:
    build:
      context: .
      target: runner
    init: true
    environment:
      DATABASE_URL: postgresql://ddd:ddd@postgres:5432/event_reservation?schema=public
      SEED_DATABASE: "true"
      AUTH_SECRET: demo-auth-secret-for-local-development-only
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      AUTH_KEYCLOAK_ID: nextjs-client
      AUTH_KEYCLOAK_SECRET: demo-nextjs-client-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/my-app
      AUTH_KEYCLOAK_WELL_KNOWN: http://keycloak:8080/realms/my-app/.well-known/openid-configuration
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/events').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    command: ["start-dev", "--import-realm"]
    environment:
      TZ: Asia/Tokyo
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/localhost/9000;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r health_status <&3;
          [[ "$$health_status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

  keycloak-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 1s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: event_reservation
      POSTGRES_USER: ddd
      POSTGRES_PASSWORD: ddd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ddd", "-d", "event_reservation"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  keycloak-postgres-data:
