name: nextjs-ddd-sample

services:
  app:
    build:
      context: .
      target: runner
    init: true
    environment:
      DATABASE_URL: postgresql://ddd:ddd@postgres:5432/event_reservation?schema=public
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://ddd:ddd@postgres:5432/event_reservation?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: event_reservation
      POSTGRES_USER: ddd
      POSTGRES_PASSWORD: ddd
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ddd", "-d", "event_reservation"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
